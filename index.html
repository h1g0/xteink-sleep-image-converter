<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xteink スリープ画像コンバータ</title>
    <meta
      name="description"
      content="Xteink X3 / X4 のスリープ画像を作るツール。切り抜き・4階調化・カレンダー描画をして BMP / XTCH で保存します。"
    />
  </head>
  <body>
    <header class="app-header">
      <h1>Xteink スリープ画像コンバータ</h1>
      <p class="lead">
        X3 / X4 用に画像を切り抜いて 4 階調に変換し、BMP または XTCH で保存します。画像はブラウザの外に送信されません。
      </p>
    </header>

    <main class="layout">
      <section class="preview-pane" aria-label="プレビュー">
        <div class="toolbar">
          <label class="button primary file-button">
            画像を開く
            <input type="file" id="file-input" accept="image/*" />
          </label>
          <span class="source-info" id="source-info">画像なし</span>
          <label class="check small"><input type="checkbox" id="actual-size" />等倍表示</label>
        </div>
        <div class="stage" id="stage">
          <canvas id="preview" width="528" height="792"></canvas>
          <div class="drop-hint" id="drop-hint">
            画像をここにドロップ
            <small>「画像を開く」や貼り付け (Ctrl+V) でも読み込めます</small>
          </div>
        </div>
        <p class="hint">画像はドラッグで移動、ホイールで拡大・縮小できます。カレンダーもドラッグで動かせます。</p>
        <figure class="device-view" data-show-if="orientation=landscape">
          <canvas id="device-preview"></canvas>
          <figcaption>保存されるデータ（端末を縦に持ったときの向き）</figcaption>
        </figure>
      </section>

      <div class="controls">
        <section class="card">
          <h2>出力</h2>
          <div class="field">
            <span class="label">機種</span>
            <div class="segmented">
              <label><input type="radio" name="device" value="x3" data-bind="device" /><span>X3 <small>528×792</small></span></label>
              <label><input type="radio" name="device" value="x4" data-bind="device" /><span>X4 <small>480×800</small></span></label>
            </div>
          </div>
          <div class="field">
            <span class="label">向き</span>
            <div class="segmented">
              <label><input type="radio" name="orientation" value="portrait" data-bind="orientation" /><span>縦向き</span></label>
              <label><input type="radio" name="orientation" value="landscape" data-bind="orientation" /><span>横向き</span></label>
            </div>
          </div>
          <label class="field" data-show-if="orientation=landscape">
            <span class="label">横向きでの持ち方</span>
            <select data-bind="hold">
              <option value="cw">右に倒す（端末の上端が右）</option>
              <option value="ccw">左に倒す（端末の上端が左）</option>
            </select>
          </label>
          <div class="field">
            <span class="label">形式</span>
            <div class="segmented">
              <label><input type="radio" name="format" value="bmp" data-bind="format" /><span>BMP</span></label>
              <label><input type="radio" name="format" value="xtch" data-bind="format" /><span>XTCH</span></label>
            </div>
          </div>
          <label class="field" data-show-if="format=bmp">
            <span class="label">BMP の色深度</span>
            <select data-bind="bmpDepth" data-type="number">
              <option value="8">8bit（推奨・互換性が高い）</option>
              <option value="4">4bit</option>
              <option value="2">2bit（最小・CrossPoint 向け）</option>
              <option value="24">24bit</option>
            </select>
          </label>
          <label class="field">
            <span class="label">ファイル名</span>
            <span class="input-suffix">
              <input type="text" data-bind="fileName" spellcheck="false" autocomplete="off" />
              <span id="file-ext">.bmp</span>
            </span>
          </label>
          <button type="button" class="button primary wide" id="download">保存する</button>
          <p class="meta" id="output-info"></p>
        </section>

        <details class="card" open>
          <summary>画像の配置</summary>
          <label class="field">
            <span class="label">拡大率 <output id="zoom-out"></output></span>
            <input type="range" id="zoom" min="10" max="400" step="1" />
          </label>
          <div class="button-row">
            <button type="button" class="button" id="fit-cover">画面を埋める</button>
            <button type="button" class="button" id="fit-contain">全体を表示</button>
            <button type="button" class="button" id="center-image">中央に戻す</button>
          </div>
          <div class="button-row">
            <button type="button" class="button" id="rotate-left" title="左に 90° 回転">⟲ 左回転</button>
            <button type="button" class="button" id="rotate-right" title="右に 90° 回転">⟳ 右回転</button>
            <button type="button" class="button" id="flip">左右反転</button>
          </div>
          <label class="field">
            <span class="label">余白の色</span>
            <select data-bind="background" data-type="number" data-options="levels"></select>
          </label>
        </details>

        <details class="card" open>
          <summary>画質・階調</summary>
          <label class="check"><input type="checkbox" data-bind="tone.autoLevels" />自動レベル補正</label>
          <label class="field">
            <span class="label">明るさ <output data-out="tone.brightness"></output></span>
            <input type="range" min="-100" max="100" step="1" data-bind="tone.brightness" />
          </label>
          <label class="field">
            <span class="label">コントラスト <output data-out="tone.contrast"></output></span>
            <input type="range" min="-100" max="100" step="1" data-bind="tone.contrast" />
          </label>
          <label class="field">
            <span class="label">ガンマ <output data-out="tone.gamma" data-digits="2"></output></span>
            <input type="range" min="0.3" max="3" step="0.05" data-bind="tone.gamma" />
          </label>
          <label class="field">
            <span class="label">シャープ <output data-out="tone.sharpen"></output></span>
            <input type="range" min="0" max="100" step="1" data-bind="tone.sharpen" />
          </label>
          <label class="check"><input type="checkbox" data-bind="tone.invert" />白黒を反転</label>
          <label class="field">
            <span class="label">ディザリング</span>
            <select data-bind="dither.method">
              <option value="floyd-steinberg">Floyd–Steinberg（なめらか）</option>
              <option value="atkinson">Atkinson（くっきり）</option>
              <option value="stucki">Stucki（細かい）</option>
              <option value="bayer">Bayer（規則的な網点）</option>
              <option value="none">なし（単純な 4 階調化）</option>
            </select>
          </label>
          <label class="field" data-show-if="dither.method!=none">
            <span class="label">ディザの強さ <output data-out="dither.strength" data-unit="%"></output></span>
            <input type="range" min="0" max="100" step="1" data-bind="dither.strength" />
          </label>
          <label class="check" data-show-if="dither.method=floyd-steinberg|atkinson|stucki">
            <input type="checkbox" data-bind="dither.serpentine" />往復走査（斜めの模様を抑える）
          </label>
        </details>

        <details class="card" open>
          <summary>カレンダー</summary>
          <label class="check strong"><input type="checkbox" data-bind="calendar.enabled" />カレンダーを描く</label>

          <div class="group" data-show-if="calendar.enabled">
            <div class="field">
              <span class="label">年月</span>
              <div class="month-picker">
                <button type="button" class="button icon" id="prev-month" title="前の月">◀</button>
                <input type="month" id="cal-month" required />
                <button type="button" class="button icon" id="next-month" title="次の月">▶</button>
                <button type="button" class="button" id="this-month">今月</button>
              </div>
            </div>
            <div class="field">
              <span class="label">週の始まり</span>
              <div class="segmented">
                <label><input type="radio" name="weekStart" value="0" data-bind="calendar.weekStart" data-type="number" /><span>日曜</span></label>
                <label><input type="radio" name="weekStart" value="1" data-bind="calendar.weekStart" data-type="number" /><span>月曜</span></label>
              </div>
            </div>
            <label class="check"><input type="checkbox" data-bind="calendar.holidays" />祝日を日曜と同じ色にする</label>

            <h3>文字</h3>
            <label class="field">
              <span class="label">フォント</span>
              <select id="font-select" data-bind="calendar.fontId"></select>
            </label>
            <div class="font-file">
              <label class="button small file-button">
                フォントファイルを読み込む
                <input type="file" id="font-file" accept=".ttf,.otf,.woff,.woff2,font/*" />
              </label>
              <span class="meta" id="font-status"></span>
            </div>
            <div class="field-pair">
              <label class="field">
                <span class="label">日付の太さ</span>
                <select data-bind="calendar.fontWeight" data-type="number" data-options="weights"></select>
              </label>
              <label class="field">
                <span class="label">見出しの太さ</span>
                <select data-bind="calendar.titleWeight" data-type="number" data-options="weights"></select>
              </label>
            </div>
            <div class="field-pair">
              <label class="field">
                <span class="label">見出し</span>
                <select data-bind="calendar.titleFormat">
                  <option value="ja-full">2026年11月</option>
                  <option value="ja-month">11月</option>
                  <option value="wareki">令和8年11月</option>
                  <option value="en-full">November 2026</option>
                  <option value="en-upper">NOVEMBER 2026</option>
                  <option value="en-month">November</option>
                  <option value="numeric">2026.11</option>
                  <option value="number">11</option>
                  <option value="none">なし</option>
                </select>
              </label>
              <label class="field" data-show-if="calendar.titleFormat!=none">
                <span class="label">見出しの位置</span>
                <select data-bind="calendar.titleAlign">
                  <option value="left">左</option>
                  <option value="center">中央</option>
                  <option value="right">右</option>
                </select>
              </label>
            </div>
            <label class="field">
              <span class="label">曜日の表記</span>
              <select data-bind="calendar.weekdayFormat">
                <option value="ja">日 月 火</option>
                <option value="en3">Sun Mon Tue</option>
                <option value="en2">Su Mo Tu</option>
                <option value="en1">S M T</option>
                <option value="none">表示しない</option>
              </select>
            </label>
            <label class="field">
              <span class="label">見出しの大きさ <output data-out="calendar.titleSize" data-unit="%"></output></span>
              <input type="range" min="20" max="150" step="1" data-bind="calendar.titleSize" />
            </label>
            <label class="field">
              <span class="label">曜日の大きさ <output data-out="calendar.weekdaySize" data-unit="%"></output></span>
              <input type="range" min="15" max="80" step="1" data-bind="calendar.weekdaySize" />
            </label>
            <label class="field">
              <span class="label">日付の大きさ <output data-out="calendar.daySize" data-unit="%"></output></span>
              <input type="range" min="15" max="90" step="1" data-bind="calendar.daySize" />
            </label>
            <label class="field">
              <span class="label">行の高さ <output data-out="calendar.rowHeight" data-unit="%"></output></span>
              <input type="range" min="40" max="150" step="1" data-bind="calendar.rowHeight" />
            </label>

            <h3>色</h3>
            <div class="field-pair">
              <label class="field">
                <span class="label">文字</span>
                <select data-bind="calendar.textColor" data-type="number" data-options="levels"></select>
              </label>
              <label class="field">
                <span class="label">日曜・祝日</span>
                <select data-bind="calendar.sundayColor" data-type="number" data-options="levels"></select>
              </label>
            </div>
            <div class="field-pair">
              <label class="field">
                <span class="label">土曜</span>
                <select data-bind="calendar.saturdayColor" data-type="number" data-options="levels"></select>
              </label>
              <label class="field" data-show-if="calendar.grid!=none">
                <span class="label">罫線</span>
                <select data-bind="calendar.gridColor" data-type="number" data-options="levels"></select>
              </label>
            </div>
            <label class="check"><input type="checkbox" data-bind="calendar.showOtherMonths" />前後の月の日付も表示</label>
            <label class="field indent" data-show-if="calendar.showOtherMonths">
              <span class="label">前後の月の色</span>
              <select data-bind="calendar.otherMonthColor" data-type="number" data-options="levels"></select>
            </label>
            <label class="field">
              <span class="label">罫線</span>
              <select data-bind="calendar.grid">
                <option value="none">なし</option>
                <option value="header">曜日の下だけ</option>
                <option value="all">格子</option>
              </select>
            </label>

            <h3>背景と縁取り</h3>
            <label class="check"><input type="checkbox" data-bind="calendar.panel" />背景を塗る</label>
            <div class="group indent" data-show-if="calendar.panel">
              <label class="field">
                <span class="label">背景の色</span>
                <select data-bind="calendar.panelColor" data-type="number" data-options="levels"></select>
              </label>
              <label class="field">
                <span class="label">不透明度 <output data-out="calendar.panelOpacity" data-unit="%"></output></span>
                <input type="range" min="0" max="100" step="1" data-bind="calendar.panelOpacity" />
              </label>
              <label class="field">
                <span class="label">角の丸み <output data-out="calendar.panelRadius" data-unit="px"></output></span>
                <input type="range" min="0" max="80" step="1" data-bind="calendar.panelRadius" />
              </label>
            </div>
            <label class="field">
              <span class="label">内側の余白 <output data-out="calendar.padding" data-unit="px"></output></span>
              <input type="range" min="0" max="80" step="1" data-bind="calendar.padding" />
            </label>
            <label class="check"><input type="checkbox" data-bind="calendar.outline" />文字を縁取る</label>
            <div class="field-pair indent" data-show-if="calendar.outline">
              <label class="field">
                <span class="label">縁の色</span>
                <select data-bind="calendar.outlineColor" data-type="number" data-options="levels"></select>
              </label>
              <label class="field">
                <span class="label">縁の太さ <output data-out="calendar.outlineWidth" data-unit="px"></output></span>
                <input type="range" min="1" max="10" step="1" data-bind="calendar.outlineWidth" />
              </label>
            </div>
            <label class="check"><input type="checkbox" data-bind="calendar.crisp" />文字をアンチエイリアスなしで描く</label>

            <h3>位置と大きさ</h3>
            <label class="field">
              <span class="label">幅 <output data-out="calendar.width" data-unit="px"></output></span>
              <input type="range" id="cal-width" min="120" max="528" step="1" data-bind="calendar.width" />
            </label>
            <div class="field-pair">
              <label class="field">
                <span class="label">X</span>
                <input type="number" step="1" data-bind="calendar.x" />
              </label>
              <label class="field">
                <span class="label">Y</span>
                <input type="number" step="1" data-bind="calendar.y" />
              </label>
            </div>
            <div class="button-row">
              <button type="button" class="button" data-anchor="top">上に置く</button>
              <button type="button" class="button" data-anchor="middle">中央に置く</button>
              <button type="button" class="button" data-anchor="bottom">下に置く</button>
            </div>
          </div>
        </details>

        <p class="footer">
          <button type="button" class="button small" id="reset-settings">設定を初期状態に戻す</button>
        </p>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
