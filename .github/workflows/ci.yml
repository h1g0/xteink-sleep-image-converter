name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR makes the previous run obsolete, so cancel it
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      # Type check with tsc, then vite build
      - run: npm run build
